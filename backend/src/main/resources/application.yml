spring:
  datasource:
    url: jdbc:sqlite:data/guestbook.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false

guestbook:
  # 쉼표로 구분한 금칙어 목록 (대소문자·공백 무시)
  banned-words: 욕설,badword
